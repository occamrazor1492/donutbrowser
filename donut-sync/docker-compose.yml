services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: donut
      POSTGRES_USER: donut
      POSTGRES_PASSWORD: donut
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U donut -d donut"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    ports:
      - "8987:9000"
      - "8988:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - minio_data:/data

  donut-sync:
    build:
      context: ..
      dockerfile: donut-sync/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "12342:12342"
    environment:
      MULTI_USER_ENABLED: "true"
      DATABASE_URL: postgresql://donut:donut@postgres:5432/donut
      JWT_SECRET: ${JWT_SECRET:-change-me}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      PORT: 12342
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://127.0.0.1:8987
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: donut-sync
      S3_FORCE_PATH_STYLE: "true"

volumes:
  postgres_data:
  minio_data:
